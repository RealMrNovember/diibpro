<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giriş — DİİBPro</title>
<style>
:root { --navy:#0b2e4f; --blue:#1273c4; --sky:#e8f2fb; --ink:#1c2733; --muted:#5b7186; --line:#e3e9f0; --err:#c0392b; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: linear-gradient(160deg, var(--sky), #fff); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.card { background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 38px 34px; width: 100%; max-width: 400px; box-shadow: 0 24px 60px rgba(11,46,79,.12); }
.logo { font-size: 26px; font-weight: 800; color: var(--navy); text-align: center; letter-spacing: -.4px; }
.logo b { color: var(--blue); }
p.sub { text-align: center; color: var(--muted); font-size: 13.5px; margin: 8px 0 28px; }
label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin: 14px 0 6px; }
input { width: 100%; padding: 13px 14px; border: 1px solid var(--line); border-radius: 11px; font-size: 15px; }
input:focus { outline: 2px solid var(--blue); border-color: transparent; }
button { width: 100%; margin-top: 24px; padding: 14px; border: 0; border-radius: 12px; background: var(--blue); color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; }
button:disabled { opacity: .6; }
.err { display: none; margin-top: 14px; background: #fdecea; color: var(--err); border-radius: 10px; padding: 11px 13px; font-size: 13px; }
.back { display: block; text-align: center; margin-top: 20px; font-size: 13px; color: var(--muted); text-decoration: none; }
</style>
</head>
<body>
<form class="card" id="f">
  <div class="logo">DİİB<b>Pro</b></div>
  <p class="sub">Dahilde İşleme Takip Sistemi</p>
  <label>E-posta</label>
  <input id="eposta" type="email" autocomplete="username" required placeholder="ornek@firma.com">
  <label>Parola</label>
  <input id="parola" type="password" autocomplete="current-password" required placeholder="••••••••">
  <div class="err" id="err"></div>
  <button id="btn">Giriş Yap</button>
  <a class="back" href="/">← Tanıtım sayfasına dön</a>
</form>
<script>
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("btn"), err = document.getElementById("err");
  btn.disabled = true; err.style.display = "none";
  try {
    const r = await fetch("/api/login", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ eposta: document.getElementById("eposta").value, parola: document.getElementById("parola").value }),
    });
    if (!r.ok) throw new Error((await r.json()).detail || "Giriş başarısız");
    location.href = "/app";
  } catch (ex) {
    err.textContent = ex.message; err.style.display = "block"; btn.disabled = false;
  }
});
</script>
</body>
</html>
